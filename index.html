<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Critical for Android WebView / Capacitor responsiveness -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="AURA - Edge-AI & Robotics Control Dashboard" />
    
    <title>AURA Control Center</title>
    
    <!-- Favicon / App Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Inline CSS reset for instant smooth dark-mode background before JS loads -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }
      #root {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Loading fallback styling while React mounts */
      .app-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 16px;
        color: #94a3b8;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #38bdf8;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- React Mount Node -->
    <div id="root">
      <!-- Fallback spinner until main React script executes -->
      <div class="app-loader">
        <div class="spinner"></div>
        <p style="font-size: 14px; letter-spacing: 1px;">INITIALIZING AURA...</p>
      </div>
    </div>

    <!-- Main React Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
